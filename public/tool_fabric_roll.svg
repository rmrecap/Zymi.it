<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <defs>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <linearGradient id="rollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" rx="12" fill="#0b1329"/>
  <!-- Fabric Cylinder Bolt -->
  <g transform="translate(100, 75) rotate(-15)">
    <ellipse cx="-45" cy="0" rx="16" ry="32" fill="#00d2ff"/>
    <ellipse cx="-45" cy="0" rx="8" ry="16" fill="#0b1329"/>
    <!-- Cylinder Body -->
    <path d="M-45,-32 L55,-32 A16,32 0 0,1 55,32 L-45,32 Z" fill="url(#rollGrad)"/>
    <ellipse cx="55" cy="0" rx="16" ry="32" fill="#3a7bd5"/>
    <!-- Rolled Fabric Ripple -->
    <path d="M-40,25 Q10,45 60,30 L70,45 Q15,60 -35,40 Z" fill="#38ef7d" opacity="0.85"/>
  </g>
</svg>