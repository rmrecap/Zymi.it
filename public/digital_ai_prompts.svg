<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c2e"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#bgGrad)"/>
  <!-- Isometric 3D Box -->
  <g transform="translate(150, 160)">
    <!-- Box Shadow -->
    <ellipse cx="0" cy="70" rx="90" ry="25" fill="#00f2fe" opacity="0.15" filter="url(#neon)"/>
    <!-- Top Face -->
    <polygon points="0,-80 75,-40 0,0 -75,-40" fill="#2d3748" stroke="#00f2fe" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="0,0 75,-40 75,55 0,95" fill="#1a202c" stroke="#00f2fe" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="-75,-40 0,0 0,95 -75,55" fill="url(#boxFront)" stroke="#00f2fe" stroke-width="1.5"/>
    <!-- Glowing Ring / Neural Motif on Left Face -->
    <circle cx="-35" cy="25" r="22" fill="none" stroke="url(#glowGrad)" stroke-width="3" filter="url(#neon)"/>
    <text x="-35" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle">AI</text>
    <text x="-35" y="36" fill="#00f2fe" font-family="system-ui, sans-serif" font-weight="700" font-size="8" text-anchor="middle" letter-spacing="1">PROMPTS</text>
  </g>
</svg>