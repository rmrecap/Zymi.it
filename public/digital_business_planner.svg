<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPlanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09203f"/>
      <stop offset="100%" stop-color="#537895"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#bgGradPlanner)"/>
  <g transform="translate(150, 160)">
    <ellipse cx="0" cy="70" rx="90" ry="25" fill="#537895" opacity="0.25"/>
    <polygon points="0,-80 75,-40 0,0 -75,-40" fill="#2c3e50" stroke="#fda085" stroke-width="1.5"/>
    <polygon points="0,0 75,-40 75,55 0,95" fill="#1a252f" stroke="#fda085" stroke-width="1.5"/>
    <polygon points="-75,-40 0,0 0,95 -75,55" fill="#111921" stroke="#f6d365" stroke-width="1.5"/>
    <!-- Notebook Emboss -->
    <rect x="-58" y="-5" width="45" height="65" rx="3" fill="#1e2b37" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="-36" y="24" fill="#f6d365" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle">BUSINESS</text>
    <text x="-36" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="8" text-anchor="middle">TOOLKIT</text>
  </g>
</svg>